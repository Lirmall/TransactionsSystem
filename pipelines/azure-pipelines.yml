trigger:
  branches:
    include:
      - master

pool:
  name: MySelfHostedPool   # твой self-hosted агент (контейнер)

variables:
  REGISTRY: 'myregistry.company.ru'
  IMAGE_TAG: '$(Build.BuildId)'

jobs:
  - job: BuildAndDeploy
    displayName: "Build images & deploy to stand"
    steps:
      - checkout: self

      - script: |
          docker version
        displayName: "Check docker"

      - script: |
          echo "$(REGISTRY_PASSWORD)" | docker login $(REGISTRY) --username "$(REGISTRY_USERNAME)" --password-stdin
        displayName: "Docker login"

      # Собираем три образа из Dockerfile.stand каждого модуля
      # ВАЖНО: контекст сборки — корень repo (.), потому что Dockerfile.stand копирует pom.xml и модули
      - script: |
          set -e
          
          docker build -f ts-accounts/Dockerfile.stand \
            -t $(REGISTRY)/ts-accounts:$(IMAGE_TAG) .
          
          docker build -f ts-transactions/Dockerfile.stand \
            -t $(REGISTRY)/ts-transactions:$(IMAGE_TAG) .
          
          docker build -f ts-reports/Dockerfile.stand \
            -t $(REGISTRY)/ts-reports:$(IMAGE_TAG) .
        displayName: "Docker build (all services)"

      - script: |
          set -e
          docker push $(REGISTRY)/ts-accounts:$(IMAGE_TAG)
          docker push $(REGISTRY)/ts-transactions:$(IMAGE_TAG)
          docker push $(REGISTRY)/ts-reports:$(IMAGE_TAG)
        displayName: "Docker push (all services)"

      - script: |
          docker logout $(REGISTRY)
        displayName: "Docker logout"

      # Deploy через Ansible: генерим compose на стенде и дергаем docker_compose
      - script: |
          set -e
          export IMAGE_TAG="$(IMAGE_TAG)"
          ansible --version
          ansible-playbook -i infra/inventory/hosts.yml infra/deploy-stand.yml \
            --extra-vars "registry_user=$(REGISTRY_USERNAME) registry_password=$(REGISTRY_PASSWORD)"
        displayName: "Ansible deploy to stand"
